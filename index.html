<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シフトマッチ検索</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <main class="container">
      <header class="hero"><div><h1>シフトマッチ検索</h1></div></header>

      <section class="panel">
        <h2>入力</h2>
        <div class="input-grid">
          <label class="input-card c1">
            <span class="input-head">文字列1</span>
            <input id="source1" type="text" autocomplete="off" spellcheck="false" placeholder="文字列を入力" />
          </label>
          <label class="input-card c2">
            <span class="input-head">文字列2</span>
            <input id="source2" type="text" autocomplete="off" spellcheck="false" placeholder="文字列を入力" />
          </label>
          <label class="input-card c3" id="source3Card" hidden>
            <span class="input-head">文字列3</span>
            <input id="source3" type="text" autocomplete="off" spellcheck="false" placeholder="文字列を入力" />
          </label>
          <button id="toggleSource3" class="add-source" type="button">＋ 文字列3を追加</button>
        </div>
        <div class="note-row"><div id="inputMeta" class="pill muted">未入力</div></div>
      </section>

      <section class="panel">
        <h2>検索設定</h2>
        <div class="settings-grid">
          <label class="range-field field-group">
            <span>拾う文字数</span>
            <span class="range-row">
              <input id="nMin" type="number" min="1" value="1" aria-label="拾う文字数の最小" />
              <span>〜</span>
              <input id="nMax" type="number" min="1" value="5" aria-label="拾う文字数の最大" />
            </span>
          </label>
          <label class="range-field field-group">
            <span>シフト数</span>
            <span class="range-row">
              <input id="shiftMin" type="number" value="-5" aria-label="シフト最小" />
              <span>〜</span>
              <input id="shiftMax" type="number" value="5" aria-label="シフト最大" />
            </span>
          </label>
          <label class="loop-check">
            <input id="loopAllowed" type="checkbox" />
            <span>シフトのループを許容</span>
          </label>
          <label class="field-row short">
            <span>最大表示件数</span>
            <input id="maxResults" type="number" min="1" max="50000" value="500" />
          </label>
          <button id="searchBtn" type="button" class="search">検索</button>
        </div>
        <div id="errorBox" class="error-box" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2>辞書選択</h2>
        <fieldset>
          <legend>検索対象の辞書（複数選択可）</legend>
          <div class="dict-groups">
            <div class="dict-group">
              <h3>日本語辞書</h3>
              <div class="dict-grid">
                <label><input type="checkbox" name="targetDict" value="kobuta" checked /> 仔豚辞書</label>
                <label><input type="checkbox" name="targetDict" value="general" checked /> 一般語辞書</label>
                <label><input type="checkbox" name="targetDict" value="item" checked /> イラスト辞書</label>
              </div>
            </div>
            <div class="dict-group">
              <h3>英語辞書</h3>
              <div class="dict-grid">
                <label><input type="checkbox" name="targetDict" value="english" checked /> 英語辞書</label>
                <label><input type="checkbox" name="targetDict" value="roma" /> ローマ字辞書</label>
              </div>
            </div>
          </div>
        </fieldset>
      </section>

      <section class="panel">
        <div class="results-header">
          <h2>結果</h2>
          <div class="result-tools">
            <label class="result-filter" for="resultFilter">
              <span>結果を絞り込み</span>
              <input id="resultFilter" type="search" autocomplete="off" spellcheck="false" placeholder="正規表現を入力" />
            </label>
            <div class="sort-row">
              <label for="sortOrder">並び順</label>
              <select id="sortOrder">
                <option value="long" selected>文字数が長い順</option>
                <option value="short">文字数が短い順</option>
              </select>
            </div>
          </div>
        </div>
        <div id="filterError" class="filter-error" aria-live="polite"></div>
        <div class="summary-row"><div id="summary" class="summary-badge">まだ検索していません</div></div>
        <div id="results"></div>
      </section>
    </main>

    <script src="dict-data.js?v=3"></script>
    <script src="search-core.js?v=4"></script>
    <script src="app.js?v=5"></script>
  </body>
</html>
