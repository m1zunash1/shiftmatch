<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シフトマッチ検索</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <div><h1>シフトマッチ検索</h1></div>
      </header>

      <section class="panel">
        <h2>入力</h2>
        <div class="input-grid">
          <label class="input-card c1">
            <span class="input-head">w_1</span>
            <input id="source1" type="text" autocomplete="off" spellcheck="false" placeholder="ひらがな文字列を入力" />
          </label>
          <label class="input-card c2">
            <span class="input-head">w_2</span>
            <input id="source2" type="text" autocomplete="off" spellcheck="false" placeholder="w_1と同じ文字数で入力" />
          </label>
          <label class="input-card c3">
            <span class="input-head">w_3（任意）</span>
            <input id="source3" type="text" autocomplete="off" spellcheck="false" placeholder="使わない場合は空欄" />
          </label>
        </div>
        <div class="note-row"><div id="inputMeta" class="pill muted">未入力</div></div>
      </section>

      <section class="panel">
        <h2>検索設定</h2>
        <div class="settings-grid">
          <fieldset class="range-field">
            <legend>拾う文字数 N</legend>
            <div class="range-row">
              <input id="nMin" type="number" min="1" value="2" aria-label="N最小" />
              <span>〜</span>
              <input id="nMax" type="number" min="1" value="2" aria-label="N最大" />
            </div>
          </fieldset>
          <fieldset class="range-field">
            <legend>シフト数</legend>
            <div class="range-row">
              <input id="shiftMin" type="number" value="-5" aria-label="シフト最小" />
              <span>〜</span>
              <input id="shiftMax" type="number" value="5" aria-label="シフト最大" />
            </div>
          </fieldset>
          <label class="field-row">
            <span>0シフトの個数</span>
            <select id="zeroMode">
              <option value="any" selected>制限なし</option>
              <option value="none">0個</option>
              <option value="one">ちょうど1個</option>
              <option value="custom">範囲指定</option>
            </select>
          </label>
          <fieldset id="zeroCustom" class="range-field" hidden>
            <legend>0シフト数</legend>
            <div class="range-row">
              <input id="zeroMin" type="number" min="0" value="0" aria-label="0シフト最小" />
              <span>〜</span>
              <input id="zeroMax" type="number" min="0" value="1" aria-label="0シフト最大" />
            </div>
          </fieldset>
          <label class="field-row short">
            <span>最大表示件数</span>
            <input id="maxResults" type="number" min="1" max="50000" value="500" />
          </label>
          <button id="searchBtn" type="button" class="search">検索</button>
        </div>
        <div id="errorBox" class="error-box" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2>辞書選択</h2>
        <fieldset>
          <legend>検索対象の辞書（複数選択可）</legend>
          <div class="dict-groups">
            <div class="dict-group">
              <h3>日本語辞書</h3>
              <div class="dict-grid">
                <label><input type="checkbox" name="targetDict" value="kobuta" checked /> 仔豚辞書</label>
                <label><input type="checkbox" name="targetDict" value="general" checked /> 一般語辞書</label>
                <label><input type="checkbox" name="targetDict" value="item" checked /> イラスト辞書</label>
              </div>
            </div>
          </div>
        </fieldset>
      </section>

      <section class="panel">
        <div class="results-header">
          <h2>結果</h2>
          <div class="sort-row">
            <label for="sortOrder">並び順</label>
            <select id="sortOrder">
              <option value="position">位置順</option>
              <option value="word">五十音順</option>
              <option value="shift">シフト量順</option>
            </select>
          </div>
        </div>
        <div class="summary-row"><div id="summary" class="summary-badge">まだ検索していません</div></div>
        <div id="results"></div>
      </section>
    </main>

    <script src="dict-data.js?v=2"></script>
    <script src="search-core.js?v=2"></script>
    <script src="app.js?v=2"></script>
  </body>
</html>
